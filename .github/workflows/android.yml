name: Build All APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 给三个项目添加执行权限
    - name: Make gradlew executable
      run: |
        chmod +x LiquidGlassClickGUI/gradlew
        chmod +x LiquidPE/gradlew
        chmod +x MD3-ClickGui-NextGen/gradlew

    # 依次编译三个项目
    - name: Build LiquidGlassClickGUI
      run: cd LiquidGlassClickGUI && ./gradlew :app:assembleDebug

    - name: Build LiquidPE
      run: cd LiquidPE && ./gradlew :app:assembleDebug

    - name: Build MD3-ClickGui-NextGen
      run: cd MD3-ClickGui-NextGen && ./gradlew :app:assembleDebug

    # 把三个项目的 APK 找出来并打包上传
    - name: Upload All APKs
      uses: actions/upload-artifact@v4
      with:
        name: All-Three-Apps
        path: |
          LiquidGlassClickGUI/app/build/outputs/apk/debug/*.apk
          LiquidPE/app/build/outputs/apk/debug/*.apk
          MD3-ClickGui-NextGen/app/build/outputs/apk/debug/*.apk
